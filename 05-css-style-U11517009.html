<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同一份內容，換一種風格</title>
<style>
* { box-sizing: border-box; }
body { margin: 24px; font-family: "Microsoft JhengHei", sans-serif; color: #243d46; background: #f5f2eb; line-height: 1.7; }
h1 { line-height: 1.3; } a { color: #17596e; }
.note { padding: 12px; background: #e5eeeb; }

/* 步驟 1：標題文字改為死亡芭比粉，大小調至 30px */
h2 { color: #FF1493; font-size: 30px; }

/* 步驟 2：重點文字改為亮粉色 */
.highlight { color: #FF007F; font-weight: bold; }

/* 步驟 3：卡片留白加大（padding: 32px）、上下外距（margin: 40px 0）、圓角（border-radius: 20px）、芭比粉邊框 */
.card { max-width: 560px; background: #ffffff; padding: 32px; margin: 40px 0; border: 3px solid #FF1493; border-radius: 20px; box-shadow: 0 3px 10px #00000012; }

/* 步驟 4：內文字體加大至 18px，行高調至 1.8 增加易讀性 */
.card p { font-size: 18px; line-height: 1.8; }

</style>
</head>
<body>
<h1>同一份內容，換一種風格</h1>
<p class="note">操作素材：請到 style 裡一次改一項，儲存並重新整理。HTML 內容先保留。</p>
<p><a href="05-color-lab.html">開啟色彩實驗室：選色、試色與複製色碼</a></p>
<article class="card">
  <h2>週末故事創作社</h2>
  <p>把生活中的小發現，變成一篇有角色、有情節的故事。歡迎喜歡畫畫、說故事或觀察生活的你。</p>
  <p class="highlight">本週任務：替故事角色設計一個小難題。</p>
</article>
<article class="card">
  <h2>我的學習目標</h2>
  <p>用清楚的文字介紹作品，讓第一次看到的人也能理解。</p>
</article>
</body>
</html>
