<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紙橋挑戰社：活動準備頁</title>
  <!-- 老師預先提供表格框線，方便辨認儲存格；本活動不用修改 CSS。 -->
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #777; padding: 8px; text-align: left; }
    caption { text-align: left; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>紙橋挑戰社：活動準備頁</h1>
  <p>我們要用簡單的材料，設計一座能承重的紙橋。</p>

  <h2>要帶的材料</h2>
  <ul>
    <li>A4 紙 3 張</li>
    <li>膠帶 1 卷</li>
    <li>積木 10 個</li>
  </ul>

  <h2>挑戰步驟</h2>
  <ol>
    <li>先畫出紙橋草圖</li>
    <li>再折出橋面並固定</li>
    <li>逐一放上積木，觀察能承受的重量</li>
    <li>記錄結果，討論如何改進</li>
  </ol>

  <h2>小組分工</h2>
  <table>
    <caption>小組任務分工表</caption>
    <thead>
      <tr>
        <th scope="col">角色</th>
        <th scope="col">負責工作</th>
        <th scope="col">預計成果</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>設計員</td>
        <td>畫出紙橋草圖</td>
        <td>預計成果是一張草圖</td>
      </tr>
      <tr>
        <td>製作員</td>
        <td>依照草圖組裝</td>
        <td>預計成果是一座紙橋</td>
      </tr>
      <tr>
        <td>紀錄員</td>
        <td>記錄測試結果</td>
        <td>預計成果是一份測試紀錄</td>
      </tr>
      <tr>
        <td>測試員</td>
        <td>放上積木並測試承重量</td>
        <td>預計成果是取得極限承載數據</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
