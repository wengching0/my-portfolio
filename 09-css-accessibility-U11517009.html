<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讓更多人能使用網站</title>
<style>
* { box-sizing: border-box; }
body { margin: 24px; font-family: "Microsoft JhengHei", sans-serif; color: #243d46; background: #f5f2eb; line-height: 1.7; }
h1 { line-height: 1.3; } a { color: #17596e; }
.note { padding: 12px; background: #e5eeeb; margin-bottom: 16px; }

.panel { background: #ffffff; padding: 20px; max-width: 720px; }

/* 1. 修正低對比：將原本過淺的 #bbbbbb 改為符合標準的 #243d46 */
.intro { color: #243d46; }

/* 2. 修正鍵盤焦點：提供清楚可見的焦點輪廓 */
a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #17596e;
  outline-offset: 3px;
}

.status { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #3b8059; margin-right: 6px; vertical-align: middle; }
input, select { max-width: 100%; padding: 10px; font: inherit; }
</style>
</head>
<body>

<p><a href="digital-tech.html">&larr; 返回數位科技概論主頁</a></p>
<br>

<h1>讓更多人能使用網站</h1>
<p class="note">無障礙修正完成版：提升文字對比度、補充表單 label 標籤、提供鍵盤 focus-visible 焦點外框，並於狀態指示燈旁增加文字說明。</p>

<main class="panel">
  <h2>故事創作社</h2>
  <p class="intro">歡迎喜歡故事的你，一起練習角色設計和情節安排。</p>

  <!-- 狀態補充文字說明，不單純依靠顏色 -->
  <p>活動狀態：<span class="status" aria-hidden="true"></span>尚有名額</p>
  
  <p><a href="#details">閱讀活動說明</a></p>

  <!-- 正確使用 label 與 for 屬性連結 input id -->
  <p>
    <label for="name">你的暱稱</label><br>
    <input id="name" type="text">
  </p>

  <p>
    <label for="session">選擇時段</label><br>
    <select id="session">
      <option>上午場</option>
      <option>下午場</option>
    </select>
  </p>

  <section id="details" tabindex="-1">
    <h2>活動說明</h2>
    <p>準備紙筆，設計一個角色，向同學介紹他的故事。</p>
  </section>
</main>

</body>
</html>
